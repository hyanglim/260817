<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 탐구 노트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

:root{
  --paper:#EEF0E4;
  --card:#FBFAF3;
  --ink:#202B22;
  --ink-soft:#5B6455;
  --ink-faint:#8B9280;
  --stamp:#2F5233;
  --stamp-soft:#3F6B45;
  --gold:#C9A227;
  --gold-soft:#E4C766;
  --rust:#8C4A2F;
  --rule:#CBC8B4;
  --shadow:0 10px 28px rgba(32,43,35,.14);
  --shadow-sm:0 2px 10px rgba(32,43,35,.10);
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Gowun Batang', serif;
  color:var(--ink);
  background:var(--paper);
  background-image: radial-gradient(var(--rule) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height:100vh;
}
.mono{font-family:'Nanum Gothic Coding', monospace;}
#app{max-width:920px;margin:0 auto;padding:0 20px 80px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 4px 18px;
  flex-wrap:wrap;gap:8px;
}
.brand{
  font-family:'Nanum Gothic Coding', monospace;
  font-weight:700;font-size:15px;letter-spacing:.02em;
  cursor:pointer;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.brand span{border-bottom:2px solid var(--gold);padding-bottom:1px;}
.topbar-links{display:flex;align-items:center;gap:16px;}
.link-btn{
  font-family:'Nanum Gothic Coding', monospace;
  font-size:12.5px;color:var(--ink-soft);background:none;border:none;
  cursor:pointer;letter-spacing:.02em;text-decoration:underline;
  text-underline-offset:3px;padding:4px 0;
}
.link-btn:hover{color:var(--stamp);}

/* ---------- landing ---------- */
.hero{padding:36px 4px 8px;}
.hero-eyebrow{font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.14em;color:var(--rust);margin:0 0 10px;}
.hero h1{font-size:34px;margin:0 0 10px;line-height:1.3;}
.hero p{color:var(--ink-soft);font-size:15.5px;margin:0 0 34px;max-width:520px;}
.cover-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px;}
.cover{
  position:relative;border-radius:var(--radius);padding:30px 26px 26px;
  cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;
  box-shadow:var(--shadow-sm);border:1.5px solid rgba(32,43,35,.08);
  min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
}
.cover:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.cover.student{background:linear-gradient(155deg,#f0f5e9,var(--card));}
.cover.teacher{background:linear-gradient(155deg,#f6efdb,var(--card));}
.cover-num{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--ink-faint);letter-spacing:.1em;}
.cover h2{font-size:22px;margin:8px 0 6px;}
.cover p{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0 0 18px;}
.cover .cover-cta{
  font-family:'Nanum Gothic Coding',monospace;font-size:12.5px;font-weight:700;
  color:var(--stamp);display:flex;align-items:center;gap:6px;
}
.cover.teacher .cover-cta{color:var(--rust);}
@media (max-width:640px){.cover-grid{grid-template-columns:1fr;}.hero h1{font-size:27px;}}

/* ---------- entry (student id) ---------- */
.entry-wrap{max-width:440px;margin:60px auto 0;text-align:center;}
.entry-wrap .hero-eyebrow{text-align:center;}
.id-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:30px 28px;margin-top:22px;border:1.5px solid rgba(32,43,35,.08);
}
.id-card input{
  width:100%;font-family:'Nanum Gothic Coding',monospace;font-size:15px;
  padding:12px 14px;border:1.5px solid var(--ink);border-radius:3px;
  background:#fff;color:var(--ink);margin-bottom:14px;
}
.id-card input:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;}

/* ---------- buttons ---------- */
.btn{
  font-family:'Nanum Gothic Coding',monospace;font-size:13px;letter-spacing:.02em;
  padding:11px 22px;border-radius:3px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.btn:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;}
.btn-primary{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- tab strip ---------- */
.tab-strip{display:flex;gap:5px;padding:0 6px;margin-top:30px;border-bottom:2px solid var(--rust);}
.tab{
  flex:1;padding:10px 6px 12px;text-align:center;cursor:pointer;
  font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;letter-spacing:.01em;
  color:var(--ink-soft);background:var(--gold-soft);border-radius:6px 6px 0 0;
  opacity:.72;transition:transform .15s ease, opacity .15s ease;
}
.tab:hover{opacity:.9;}
.tab.active{background:var(--card);color:var(--ink);opacity:1;transform:translateY(-3px);font-weight:700;box-shadow:var(--shadow-sm);}
.tab .tnum{display:block;font-size:10px;color:var(--ink-faint);margin-bottom:2px;}
.tab.active .tnum{color:var(--rust);}
.tab.done .tlabel::after{content:' ✓';color:var(--stamp);}
@media (max-width:640px){.tab .tlabel{font-size:10.5px;}}

/* ---------- page (stage card) ---------- */
.page{
  position:relative;background:var(--card);
  background-image:repeating-linear-gradient(to bottom, transparent 0 33px, var(--rule) 33px 34px);
  padding:38px 34px 30px 62px;border-radius:0 0 var(--radius) var(--radius);
  box-shadow:var(--shadow);margin-bottom:26px;
}
.page::before{content:'';position:absolute;left:42px;top:0;bottom:0;width:1px;background:var(--rust);opacity:.35;}
.page-eyebrow{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--rust);letter-spacing:.12em;margin:0 0 6px;}
.page h2{font-size:24px;margin:0 0 22px;}
.field{margin-bottom:22px;}
.field label{display:block;font-family:'Nanum Gothic Coding',monospace;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.field textarea{
  width:100%;min-height:74px;resize:vertical;font-family:'Gowun Batang',serif;font-size:14.5px;
  line-height:1.7;padding:10px 12px;border:none;border-bottom:1.5px dashed var(--ink-faint);
  background:transparent;color:var(--ink);
}
.field textarea::placeholder{color:var(--ink-faint);}
.field textarea:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:2px;}

.page-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-top:8px;padding-top:16px;border-top:1px solid var(--rule);}
.save-meta{font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;color:var(--ink-faint);}
.footer-actions{display:flex;gap:10px;position:relative;}

/* ---------- stage layout (page + tutor panel) ---------- */
.stage-layout{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start;margin-top:0;}
@media (max-width:860px){.stage-layout{grid-template-columns:1fr;}}

/* ---------- AI 튜터 패널 ---------- */
.tutor-panel{
  background:var(--card);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);
  padding:16px 15px 14px;display:flex;flex-direction:column;
  position:sticky;top:18px;max-height:calc(100vh - 60px);
  border-top:3px solid var(--gold);
}
@media (max-width:860px){.tutor-panel{position:static;max-height:520px;}}
.tutor-head{
  font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:12.5px;letter-spacing:.03em;
  margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--rule);display:flex;align-items:center;gap:6px;
}
.tutor-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px;margin-bottom:10px;min-height:100px;max-height:400px;}
.tbubble{max-width:92%;padding:8px 11px;border-radius:9px;font-size:12.8px;line-height:1.6;font-family:'Gowun Batang',serif;}
.tbubble.assistant{background:#eef4ea;align-self:flex-start;border-bottom-left-radius:2px;}
.tbubble.user{background:#f2efe0;align-self:flex-end;border-bottom-right-radius:2px;}
.tbubble-role{font-family:'Nanum Gothic Coding',monospace;font-size:9.5px;color:var(--ink-faint);margin-bottom:3px;letter-spacing:.02em;}
.tutor-input-row{display:flex;flex-direction:column;gap:8px;}
.tutor-input-row textarea{
  width:100%;min-height:50px;resize:vertical;font-family:'Gowun Batang',serif;font-size:13px;
  padding:8px 10px;border:1.5px solid var(--ink-faint);border-radius:4px;color:var(--ink);background:#fff;
}
.tutor-input-row textarea:focus-visible{outline:2px solid var(--stamp);outline-offset:1px;}
.tutor-input-row .btn{align-self:flex-end;font-size:12px;padding:8px 16px;}

.apikey-box{padding:4px 2px 2px;}
.apikey-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin:0 0 12px;}
.apikey-box input{
  width:100%;font-family:'Nanum Gothic Coding',monospace;font-size:12.5px;padding:9px 10px;
  border:1.5px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);margin-bottom:10px;
}
.apikey-link{display:block;font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--rust);margin-top:12px;text-decoration:underline;text-underline-offset:2px;}
.apikey-error{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:#a33;margin:0 0 10px;}
.tutor-key-link{font-size:10.5px;color:var(--ink-faint);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:none;font-family:'Nanum Gothic Coding',monospace;padding:0;}

.tutor-transcript{margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);}
.tutor-transcript .tt-head{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--rust);margin-bottom:10px;letter-spacing:.04em;}
.tutor-transcript .tbubble{max-width:100%;margin-bottom:8px;}

/* ---------- 수준 선택 ---------- */
.level-select-wrap{margin-left:auto;}
.level-select{
  font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--ink-soft);
  border:1px solid var(--ink-faint);border-radius:3px;background:#fff;padding:3px 6px;cursor:pointer;
}
.level-chips{display:flex;gap:8px;margin:14px 0 4px;}
.level-chip{
  flex:1;text-align:center;padding:10px 6px;border:1.5px solid var(--ink-faint);border-radius:3px;
  font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--ink-soft);cursor:pointer;background:#fff;
}
.level-chip.selected{border-color:var(--stamp);color:var(--stamp);background:#eef4ea;font-weight:700;}
.level-label{font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;color:var(--ink-faint);text-align:left;margin:16px 0 0;}

/* ---------- 코드 창 (분석 단계) ---------- */
.code-panel{margin:6px 0 24px;border-radius:4px;overflow:hidden;box-shadow:var(--shadow-sm);}
.code-panel-head{
  display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  background:#2b3a2c;color:#eef4ea;font-family:'Nanum Gothic Coding',monospace;font-size:12px;letter-spacing:.03em;
}
.code-panel-head .badge{font-size:10.5px;color:#d8c98a;}
.code-editor{
  display:block;width:100%;min-height:130px;background:#1c241c;color:#e7ecdf;
  font-family:'Nanum Gothic Coding',monospace;font-size:13px;line-height:1.65;border:none;padding:14px;
  resize:vertical;tab-size:4;
}
.code-editor::placeholder{color:#6c7a67;}
.code-editor:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
.code-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#232c22;flex-wrap:wrap;}
.code-actions .hint{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:#c8bd93;}
.code-run-btn{
  font-family:'Nanum Gothic Coding',monospace;font-size:12px;padding:8px 16px;border-radius:3px;
  border:1.5px solid var(--gold);background:var(--gold);color:#2b2408;cursor:pointer;
}
.code-run-btn[disabled]{opacity:.5;cursor:not-allowed;}
.code-output-label{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:#8fae86;background:#1c241c;padding:10px 14px 0;}
.code-output{margin:0;background:#1c241c;color:#b9d9ae;font-family:'Nanum Gothic Coding',monospace;font-size:12.5px;
  padding:8px 14px 16px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;}
.code-output-editable{
  width:100%;min-height:80px;background:#1c241c;color:#e7ecdf;font-family:'Nanum Gothic Coding',monospace;
  font-size:12.5px;padding:10px 14px;border:none;resize:vertical;
}

/* ---------- 상관관계 시뮬레이션 패널 (시각화 단계) ---------- */
.sim-panel{margin:6px 0 24px;border:1.5px dashed var(--rust);border-radius:4px;padding:16px 16px 14px;background:#f8f6ec;}
.sim-panel-head{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:13px;margin:0 0 4px;}
.sim-note{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--ink-faint);margin:0 0 14px;line-height:1.6;}
.sim-var-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.sim-var-row input{
  font-family:'Gowun Batang',serif;font-size:13px;padding:7px 10px;border:1.5px solid var(--ink-faint);
  border-radius:3px;flex:1;min-width:120px;background:#fff;color:var(--ink);
}
.sim-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.sim-chip{
  display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--ink-faint);
  border-radius:14px;padding:4px 6px 4px 11px;font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;
}
.sim-chip-x{border:none;background:none;cursor:pointer;color:var(--rust);font-size:12px;padding:2px 4px;line-height:1;}
.sim-empty-hint{font-family:'Nanum Gothic Coding',monospace;font-size:12px;color:var(--ink-faint);padding:6px 0 2px;}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-bottom:4px;}
.sim-thumb{
  background:#fff;border:1px solid var(--rule);border-radius:4px;padding:6px 6px 8px;cursor:pointer;
  text-align:center;transition:transform .12s ease, box-shadow .12s ease;
}
.sim-thumb:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.sim-thumb.active{border-color:var(--stamp);box-shadow:0 0 0 2px rgba(47,82,51,.22);}
.sim-svg{width:100%;height:56px;display:block;}
.sim-thumb-label{font-family:'Nanum Gothic Coding',monospace;font-size:9.5px;color:var(--ink-soft);margin-top:4px;word-break:break-all;}
.sim-expanded{margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);}
.sim-expanded-head{font-family:'Nanum Gothic Coding',monospace;font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sim-badge{font-size:10.5px;font-weight:700;color:var(--stamp);background:#eef4ea;border-radius:10px;padding:3px 9px;}
.sim-svg-big{width:100%;max-width:360px;height:210px;display:block;background:#fff;border:1px solid var(--rule);border-radius:4px;}
.sim-axis{font-family:'Nanum Gothic Coding',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:6px;}
.sim-blurb{font-size:13px;color:var(--ink-soft);margin:8px 0 0;line-height:1.65;}

/* ---------- 데이터 업로드 패널 (데이터 단계, 로컬 전용) ---------- */
.upload-panel{margin:6px 0 24px;border:1.5px dashed var(--rust);border-radius:4px;padding:16px 16px 14px;background:#f8f6ec;}
.upload-panel-head{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:13px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.upload-panel-head .badge{font-size:10.5px;font-weight:400;color:var(--ink-soft);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:2px 9px;}
.upload-panel input[type=file]{font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;margin-bottom:4px;max-width:100%;}
.upload-or{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--ink-faint);margin:14px 0 6px;}
.upload-table-wrap{overflow-x:auto;margin-top:6px;border:1px solid var(--rule);border-radius:3px;}
.upload-table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:'Nanum Gothic Coding',monospace;background:#fff;}
.upload-table th, .upload-table td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
.upload-table th{background:#f0eee0;font-weight:700;border-bottom:1.5px solid var(--ink-faint);}
.upload-more{font-family:'Nanum Gothic Coding',monospace;font-size:10.5px;color:var(--ink-faint);margin:6px 0 0;}

/* ---------- stamp flash ---------- */
.stamp-flash{
  position:absolute;right:14px;bottom:64px;
  border:3px double var(--stamp);color:var(--stamp);
  font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:13px;
  padding:8px 18px;border-radius:2px;letter-spacing:.06em;
  transform:rotate(-8deg) scale(.6);opacity:0;pointer-events:none;
  animation: stampIn .45s ease forwards, stampOut .4s ease 1.55s forwards;
  background:rgba(251,250,243,.85);
}
@keyframes stampIn{to{opacity:1;transform:rotate(-8deg) scale(1);}}
@keyframes stampOut{to{opacity:0;}}
@media (prefers-reduced-motion: reduce){.stamp-flash{animation:none;opacity:1;transform:rotate(-8deg) scale(1);}}

.complete-note{
  margin-top:4px;padding:16px 20px;background:#eef4ea;border:1.5px dashed var(--stamp);
  border-radius:3px;font-family:'Nanum Gothic Coding',monospace;font-size:12.5px;color:var(--stamp-soft);
}

/* ---------- loading ---------- */
.loading-box{text-align:center;padding:80px 20px;color:var(--ink-soft);font-family:'Nanum Gothic Coding',monospace;font-size:13px;}
.loading-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--stamp);margin:0 3px;animation:blink 1.1s infinite ease-in-out;}
.loading-dot:nth-child(2){animation-delay:.18s;}
.loading-dot:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
@media (prefers-reduced-motion: reduce){.loading-dot{animation:none;opacity:1;}}

/* ---------- teacher list ---------- */
.list-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:30px 0 20px;}
.list-head h1{font-size:24px;margin:0;}
.list-count{color:var(--ink-soft);font-size:13.5px;}
.empty-box{padding:50px 20px;text-align:center;color:var(--ink-faint);font-family:'Nanum Gothic Coding',monospace;font-size:13px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.index-card{
  background:var(--card);border-radius:var(--radius);padding:18px 18px 16px;cursor:pointer;
  box-shadow:var(--shadow-sm);border-left:4px solid var(--gold);transition:transform .14s ease, box-shadow .14s ease;
}
.index-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.index-card .sid{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:15px;margin-bottom:8px;word-break:break-all;}
.index-card .srow{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-top:4px;}

/* ---------- teacher detail ---------- */
.detail-head{margin:30px 0 6px;}
.detail-head h1{font-size:26px;margin:0 0 4px;font-family:'Nanum Gothic Coding',monospace;}
.summary-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 28px;}
.summary-chip{
  background:var(--card);border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow-sm);
  font-family:'Nanum Gothic Coding',monospace;min-width:140px;
}
.summary-chip .k{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:4px;}
.summary-chip .v{font-size:15px;font-weight:700;}

.stage-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden;}
.stage-block-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#f2efe0;}
.stage-block-head .t{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:13.5px;}
.stage-block-head .m{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--ink-soft);}
.stage-block-body{padding:16px 20px 18px;}
.sfield{margin-bottom:12px;}
.sfield .sl{font-family:'Nanum Gothic Coding',monospace;font-size:11.5px;color:var(--rust);margin-bottom:4px;}
.sfield .sv{font-size:14px;line-height:1.7;white-space:pre-wrap;}
.sfield .sv.empty{color:var(--ink-faint);font-style:italic;}

/* ============ 상관관계 시뮬레이션 (시각화 단계) ============ */
const CORR_TYPES = [
  {key:'strong_pos', r:0.85, label:'강한 양의 관계', blurb:'한 값이 커질수록 다른 값도 뚜렷하게 함께 커지는 경향이 보여요.'},
  {key:'weak_pos', r:0.4, label:'약한 양의 관계', blurb:'함께 커지는 경향이 있지만 흩어짐이 커서 확신하기는 어려워요.'},
  {key:'none', r:0.0, label:'뚜렷한 관계 없음', blurb:'두 값 사이에 눈에 띄는 패턴이 보이지 않아요.'},
  {key:'weak_neg', r:-0.4, label:'약한 음의 관계', blurb:'한 값이 커질 때 다른 값이 줄어드는 경향이 약하게 보여요.'},
  {key:'strong_neg', r:-0.85, label:'강한 음의 관계', blurb:'한 값이 커질수록 다른 값은 뚜렷하게 줄어드는 경향이 보여요.'}
];
function hashStr(s){
  let h = 0;
  for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function seededRandom(seed){
  let s = seed % 2147483647; if (s<=0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
function corrTypeFor(keyA, keyB){
  const pair = [keyA, keyB].sort();
  return CORR_TYPES[hashStr(pair[0]+'|'+pair[1]) % CORR_TYPES.length];
}
function genSimPoints(keyA, keyB, n){
  n = n || 26;
  const pair = [keyA, keyB].sort();
  const rand = seededRandom(hashStr(pair[0]+'::'+pair[1]) || 1);
  const ct = corrTypeFor(keyA, keyB);
  const points = [];
  for (let i=0;i<n;i++){
    const x = rand();
    let y = ct.r*x + (1-Math.abs(ct.r))*rand();
    y = Math.max(0, Math.min(1, y*0.85+0.08));
    points.push({x, y});
  }
  return { points, corr: ct };
}
function svgScatter(points, w, h, dotR, cls){
  const pad = Math.max(6, dotR*2.5);
  const circles = points.map(p=>{
    const cx = pad + p.x*(w-2*pad);
    const cy = (h-pad) - p.y*(h-2*pad);
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dotR}" fill="#2F5233" opacity="0.72"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="${cls||'sim-svg'}">${circles}</svg>`;
}

/* ============ 데이터 업로드 (완전히 로컬/세션 전용 — 저장소에 저장되지 않음) ============ */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r'){ /* CRLF의 \r은 건너뜀 */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  while (rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]===''){ rows.pop(); }
  return rows;
}
function parseCSVToObject(text){
  const rows = parseCSV(text);
  if (!rows.length) return null;
  const headers = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1).filter(r => r.some(c => (c||'').trim() !== ''));
  return { headers, rows: dataRows };
}
function processUploadedText(text, fileName){
  try{
    const parsed = parseCSVToObject(text);
    if (!parsed || !parsed.headers.length || parsed.headers.every(h=>!h)){
      state.uploadError = 'CSV 형식을 읽을 수 없어요. 첫 줄에 헤더(열 이름)가 있는지 확인해주세요.';
      state.uploadedData = null;
    } else {
      state.uploadedData = { fileName: fileName || '붙여넣은 데이터', headers: parsed.headers, rows: parsed.rows };
      state.uploadError = '';
    }
  }catch(e){
    console.error('CSV 처리 실패', e);
    state.uploadError = '파일을 처리하는 중 문제가 생겼어요.';
    state.uploadedData = null;
  }
  render();
}
function handleFileUpload(inputEl){
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => processUploadedText(e.target.result, file.name);
  reader.onerror = () => { state.uploadError = '파일을 읽는 중 문제가 생겼어요. 다시 시도해주세요.'; render(); };
  reader.readAsText(file);
}
function pasteRawCSV(){
  const el = document.getElementById('csv-paste-area');
  const text = el ? el.value : '';
  if (!text.trim()) return;
  processUploadedText(text, null);
}
function clearUploadedData(){
  state.uploadedData = null;
  state.uploadError = '';
  render();
}

/* ============ 유틸 ============ */
function escapeHtml(s){
  if (s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso){
  if (!iso) return '-';
  try{
    const d = new Date(iso);
    return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return '-'; }
}
function newStudentData(id, level){
  const stages = {};
  const tutorChats = {};
  STAGES.forEach(s=> { stages[s.key] = null; tutorChats[s.key] = []; });
  return { studentId:id, level: level || 'mid', createdAt:new Date().toISOString(), currentStageIndex:0, stages, tutorChats };
}
function computeSummary(student){
  let lastUpdated = student.createdAt;
  let totalRevisions = 0;
  STAGES.forEach(s=>{
    const st = student.stages[s.key];
    if (st){
      totalRevisions += st.revisionCount || 0;
      if (new Date(st.updatedAt) > new Date(lastUpdated)) lastUpdated = st.updatedAt;
    }
  });
  const idx = student.currentStageIndex || 0;
  return { currentLabel: STAGES[idx].label, currentIndex: idx, lastUpdated, totalRevisions };
}

/* ============ 저장소 (Firebase Firestore 우선, 미설정/실패 시 localStorage로 자동 폴백) ============ */
/* ⚙️ Firebase 설정 — Firebase 콘솔(프로젝트 설정 > 일반 > 내 앱)에서 복사한 값을 아래에 붙여넣으세요.
   비워두면 이 브라우저에만 저장되는 localStorage 모드로 자동 동작합니다. */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const FS_COLLECTION = 'students';

let _firebaseReady = false;
let _firebaseInitPromise = null;
let _db = null;

function ensureFirebaseInit(){
  if (_firebaseInitPromise) return _firebaseInitPromise;
  _firebaseInitPromise = (async () => {
    if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
      return false; // 설정값 없음 → localStorage 모드
    }
    try{
      if (typeof firebase === 'undefined'){
        await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
        await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js');
        await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js');
      }
      firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      _db = firebase.firestore();
      _firebaseReady = true;
      return true;
    }catch(e){
      console.error('Firebase 연결 실패, 브라우저 저장(localStorage)으로 전환합니다.', e);
      _firebaseReady = false;
      return false;
    }
  })();
  return _firebaseInitPromise;
}

/* localStorage 폴백 계층 */
const _memoryFallback = {};
let _lsAvailable = true;
try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); }catch(e){ _lsAvailable = false; }

async function lsGet(key){
  try{
    const v = _lsAvailable ? localStorage.getItem(key) : (_memoryFallback.hasOwnProperty(key) ? _memoryFallback[key] : null);
    return v!=null ? {key, value:v} : null;
  }catch(e){ return null; }
}
async function lsSet(key, value){
  try{
    if (_lsAvailable) localStorage.setItem(key, value); else _memoryFallback[key] = value;
    return {key, value};
  }catch(e){ console.error('저장 실패', e); return null; }
}
async function lsList(prefix){
  try{
    const keys = [];
    if (_lsAvailable){
      for (let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if (!prefix || k.startsWith(prefix)) keys.push(k);
      }
    } else {
      Object.keys(_memoryFallback).forEach(k=>{ if (!prefix || k.startsWith(prefix)) keys.push(k); });
    }
    return { keys };
  }catch(e){ return { keys: [] }; }
}

async function loadStudent(id){
  await ensureFirebaseInit();
  if (_firebaseReady){
    try{
      const doc = await _db.collection(FS_COLLECTION).doc(id).get();
      if (doc.exists) return doc.data();
      return null;
    }catch(e){ console.error('Firestore 조회 실패, localStorage로 재시도합니다.', e); }
  }
  try{
    const res = await lsGet(KEY_PREFIX + id);
    if (res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){ return null; }
}
async function saveStudentData(id, data){
  await ensureFirebaseInit();
  if (_firebaseReady){
    try{
      await _db.collection(FS_COLLECTION).doc(id).set(data);
      return true;
    }catch(e){ console.error('Firestore 저장 실패, localStorage로 재시도합니다.', e); }
  }
  try{
    const res = await lsSet(KEY_PREFIX + id, JSON.stringify(data));
    return !!res;
  }catch(e){ console.error('저장 실패', e); return false; }
}
async function loadAllStudents(){
  await ensureFirebaseInit();
  if (_firebaseReady){
    try{
      const snap = await _db.collection(FS_COLLECTION).get();
      return snap.docs.map(d => d.data());
    }catch(e){ console.error('Firestore 목록 조회 실패, localStorage로 재시도합니다.', e); }
  }
  try{
    const res = await lsList(KEY_PREFIX);
    if (!res || !res.keys) return [];
    const ids = res.keys.map(k => k.startsWith(KEY_PREFIX) ? k.slice(KEY_PREFIX.length) : k);
    const out = [];
    for (const id of ids){
      const data = await loadStudent(id);
      if (data) out.push(data);
    }
    return out;
  }catch(e){ console.error('목록 조회 실패', e); return []; }
}

   여기 값만 바꾸면 됩니다. 2026-08 기준 사용 가능한 모델:

   최신 목록은 https://ai.google.dev/gemini-api/docs/models 에서 확인하세요. */

const API_KEY_LS_KEY = 'ai_tutor_api_key';

}

  try{
    if (_lsAvailable){
      if (v) localStorage.setItem(API_KEY_LS_KEY, v); else localStorage.removeItem(API_KEY_LS_KEY);
    } else {
      if (v) _memoryFallback[API_KEY_LS_KEY] = v; else delete _memoryFallback[API_KEY_LS_KEY];
    }
    return true;
  }catch(e){ return false; }
}

function renderStudentApp(){
  if (state.loading) return topbar('') + loadingBox(state.loadingMessage);
  const student = state.student;
  const stage = STAGES[state.viewIndex];
  const savedStage = student.stages[stage.key];

  const tabs = STAGES.map((s,i)=>{
    const active = i===state.viewIndex ? ' active' : '';
    const done = student.stages[s.key] ? ' done' : '';
    return `<div class="tab${active}${done}" onclick="setViewIndex(${i})"><span class="tnum">${s.num}</span><span class="tlabel">${escapeHtml(s.label)}</span></div>`;
  }).join('');

  const fields = stage.fields.map(f=>`
    <div class="field">
      <label for="f_${f.id}">${escapeHtml(f.label)}</label>
      <textarea id="f_${f.id}" placeholder="${escapeHtml(f.ph)}" oninput="onFieldInput('${f.id}', this.value)">${escapeHtml(state.draft[f.id]||'')}</textarea>
    </div>
  `).join('');

  const codePanel = stage.hasCode ? renderCodePanel() : '';
  const simPanel = stage.hasSim ? renderSimPanel() : '';
  const uploadPanel = stage.hasUpload ? renderUploadPanel() : '';

  const isLast = state.viewIndex === STAGES.length - 1;
  const allDone = STAGES.every(s => !!student.stages[s.key]);
  const saveMeta = savedStage
    ? `마지막 저장 ${fmtDate(savedStage.updatedAt)} · 수정 ${savedStage.revisionCount}회`
    : '아직 저장되지 않았습니다';

  const nextBtn = isLast
    ? `<button class="btn btn-primary" onclick="handleSave()">저장</button>`
    : `<button class="btn btn-primary" onclick="handleNext()">다음 단계 →</button>`;

  const completeNote = (isLast && allDone)
    ? `<div class="complete-note">🗂 6단계를 모두 작성했습니다. 언제든 탭을 눌러 내용을 다시 확인하거나 고칠 수 있어요.</div>`
    : '';

  return `
    ${topbar(`<div class="topbar-links"><span class="link-btn" style="text-decoration:none;cursor:default;">ID: ${escapeHtml(student.studentId)}</span><button class="link-btn" onclick="switchStudent()">다른 ID로 시작</button></div>`)}
    <div class="tab-strip">${tabs}</div>
    <div class="stage-layout">
      <div class="page">
        <p class="page-eyebrow">${stage.num} · ${escapeHtml(stage.label)}</p>
        <h2># ${escapeHtml(stage.label)}</h2>
        ${uploadPanel}
        ${fields}
        ${codePanel}
        ${simPanel}
        <div class="page-footer">
          <div class="save-meta">${saveMeta}</div>
          <div class="footer-actions">
            <button class="btn" onclick="handleSave()">저장</button>
            ${nextBtn}
            ${state.stampFlash ? `<div class="stamp-flash">저장완료 ✓</div>` : ''}
          </div>
        </div>
      </div>
      ${renderTutorPanel()}
    </div>
    ${completeNote}
  `;
}

function renderCodePanel(){
  let badge = '';
  if (state.pyodideLoading) badge = '<span class="badge">환경 준비 중...</span>';
  else if (state.pyodideError) badge = '<span class="badge">⚠ 실행 불가 · 직접 입력 모드</span>';
  else if (state.pandasLoading) badge = '<span class="badge">pandas 불러오는 중...</span>';
  else if (state.pandasReady) badge = '<span class="badge">✓ pandas 사용 가능</span>';

  let hintText;
  if (state.uploadedData && state.pandasReady){
    hintText = `업로드한 데이터(${escapeHtml(state.uploadedData.fileName)})를 rows, headers, 그리고 pandas DataFrame df로 바로 쓸 수 있어요.`;
  } else if (state.uploadedData){
    hintText = `업로드한 데이터(${escapeHtml(state.uploadedData.fileName)})를 rows, headers 변수로 바로 쓸 수 있어요.`;
  } else if (state.pandasReady){
    hintText = 'pandas(pd), numpy(np)를 바로 사용할 수 있어요.';
  } else {
    hintText = 'Python 기본 문법을 지원해요.';
  }
  const runControls = state.pyodideError
    ? `<span class="hint">이 환경에서는 코드를 직접 실행할 수 없어요. 다른 곳에서 실행한 결과를 아래에 적어주세요.</span>`
    : `<button class="code-run-btn" onclick="runCode()" ${state.codeRunning?'disabled':''}>${state.codeRunning?'실행하는 중...':'▶ 실행하기'}</button>
       <span class="hint">${hintText}</span>`;

  const outputBlock = state.pyodideError
    ? `<textarea class="code-output-editable" placeholder="실행 결과를 직접 적어주세요" oninput="onOutputInput(this.value)">${escapeHtml(state.draft.__output||'')}</textarea>`
    : `<pre class="code-output">${escapeHtml(state.draft.__output || '아직 실행 결과가 없습니다')}</pre>`;

  return `
    <div class="code-panel">
      <div class="code-panel-head"><span>💻 분석 코드 (Python)</span>${badge}</div>
      <textarea id="code-editor" class="code-editor" spellcheck="false" placeholder="예: data = [3, 5, 2, 8]&#10;print(sum(data) / len(data))"
        oninput="onCodeInput(this.value)">${escapeHtml(state.draft.__code||'')}</textarea>
      <div class="code-actions">${runControls}</div>
      <div class="code-output-label">실행 결과</div>
      ${outputBlock}
    </div>
  `;
}

function renderSimPanel(){
  const vars = state.draft.__simVars || [];
  const pair = state.draft.__simPair;

  const chips = vars.map((v,i)=>`
    <span class="sim-chip">${escapeHtml(v)}<button class="sim-chip-x" onclick="removeSimVar(${i})" aria-label="삭제">✕</button></span>
  `).join('');

  let gridOrHint;
  if (vars.length < 2){
    gridOrHint = `<div class="sim-empty-hint">변수를 2개 이상 추가하면 조합별 미리보기가 나타나요. (데이터 단계에서 적은 변수를 자동으로 가져왔어요)</div>`;
  } else {
    const thumbs = [];
    for (let i=0;i<vars.length;i++){
      for (let j=i+1;j<vars.length;j++){
        const {points} = genSimPoints(vars[i], vars[j], 20);
        const isActive = pair && ((pair[0]===vars[i]&&pair[1]===vars[j])||(pair[0]===vars[j]&&pair[1]===vars[i]));
        thumbs.push(`
          <div class="sim-thumb${isActive?' active':''}" onclick="selectSimPairByIndex(${i},${j})">
            ${svgScatter(points, 100, 62, 2)}
            <div class="sim-thumb-label">${escapeHtml(vars[i])} × ${escapeHtml(vars[j])}</div>
          </div>`);
      }
    }
    gridOrHint = `<div class="sim-grid">${thumbs.join('')}</div>`;
  }

  let expanded = '';
  if (pair && pair[0] && pair[1]){
    const {points, corr} = genSimPoints(pair[0], pair[1], 42);
    expanded = `
      <div class="sim-expanded">
        <div class="sim-expanded-head">${escapeHtml(pair[0])} × ${escapeHtml(pair[1])} <span class="sim-badge">${corr.label}</span></div>
        ${svgScatter(points, 340, 210, 3, 'sim-svg-big')}
        <div class="sim-axis">X축: ${escapeHtml(pair[0])} · Y축: ${escapeHtml(pair[1])}</div>
        <p class="sim-blurb">${escapeHtml(corr.blurb)} 실제로 그런지는 진짜 데이터를 분석해봐야 확인할 수 있어요.</p>
      </div>`;
  }

  return `
    <div class="sim-panel">
      <div class="sim-panel-head">🔬 키값 상관관계 미리보기</div>
      <p class="sim-note">🧪 예시 시뮬레이션이에요 (실제 데이터 아님) — 변수 조합을 고르기 전에 어떤 모양의 관계가 나올 수 있는지 미리 살펴보는 용도예요.</p>
      <div class="sim-var-row">
        <input id="sim-var-input" placeholder="변수 이름 입력 (예: 공부시간)" onkeydown="if(event.key==='Enter'){event.preventDefault();addSimVar();}">
        <button class="btn" onclick="addSimVar()">추가</button>
      </div>
      ${chips ? `<div class="sim-chips">${chips}</div>` : ''}
      ${gridOrHint}
      ${expanded}
    </div>
  `;
}

function renderUploadPanel(){
  const d = state.uploadedData;
  const errorHtml = state.uploadError ? `<p class="apikey-error">${escapeHtml(state.uploadError)}</p>` : '';

  if (!d){
    return `
      <div class="upload-panel">

        <p class="sim-note" style="margin:0 0 12px;">CSV 파일을 올리면 미리보기를 볼 수 있고, 분석 단계 코드 창에서 <code>rows</code>, <code>headers</code> 변수로 바로 불러와 쓸 수 있어요. 업로드한 데이터는 이 브라우저 화면에서만 쓰이고 어디에도 저장되지 않아요 — 다시 접속하면 새로 올려야 해요.</p>

        <input type="file" accept=".csv,text/csv" id="csv-file-input" onchange="handleFileUpload(this)">
        <p class="upload-or">또는 CSV 내용을 직접 붙여넣기</p>
        <textarea id="csv-paste-area" class="code-editor" style="min-height:76px;background:#fff;color:var(--ink);" placeholder="이름,점수&#10;철수,90&#10;영희,85"></textarea>
        <button class="btn" onclick="pasteRawCSV()" style="margin-top:8px;">붙여넣은 내용 불러오기</button>
      </div>
    `;
  }

  const previewRows = d.rows.slice(0, 8);
  const table = `
    <div class="upload-table-wrap">
      <table class="upload-table">
        <thead><tr>${d.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
        <tbody>${previewRows.map(r=>`<tr>${d.headers.map((_,i)=>`<td>${escapeHtml(r[i]!=null?r[i]:'')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  const moreNote = d.rows.length > previewRows.length
    ? `<p class="upload-more">...외 ${d.rows.length - previewRows.length}행 더 있음</p>` : '';

  return `
    <div class="upload-panel">
      <div class="upload-panel-head">📎 데이터 업로드 <span class="badge">${escapeHtml(d.fileName)}</span></div>
      <p class="sim-note" style="margin:0 0 10px;">${d.rows.length}행 · ${d.headers.length}열을 불러왔어요 (이 브라우저에서만 사용되며 저장되지 않아요). 분석 단계 코드 창에서 <code>rows</code>, <code>headers</code> 변수로 바로 쓸 수 있어요.</p>
      ${table}
      ${moreNote}
      <button class="btn" onclick="clearUploadedData()" style="margin-top:10px;">다른 파일로 바꾸기</button>
    </div>
  `;
}

        return `<div class="sfield"><div class="sl">${escapeHtml(f.label)}</div><div class="sv ${v?'':'empty'}">${v?escapeHtml(v):'입력 없음'}</div></div>`;
      }).join('');
      body = `<div class="stage-block-body">${body}${codeHtml}${simHtml}${tutorHtml}</div>`;
    } else if (chats.length){
      body = `<div class="stage-block-body"><div class="not-started" style="padding:0 0 4px;">작성 내용은 아직 없지만 튜터와 대화한 기록이 있습니다.</div>${tutorHtml}</div>`;
    } else {
      body = `<div class="not-started">아직 작성하지 않음</div>`;
    }
    return `<div class="stage-block">
      <div class="stage-block-head"><span class="t">${s.num} · ${escapeHtml(s.label)}</span><span class="m">${escapeHtml(headMeta)}</span></div>
      ${body}
    </div>`;
  }).join('');

  return `
    ${topbar(links)}
    <div class="detail-head"><h1>${escapeHtml(student.studentId)}</h1></div>
    ${chips}
    ${blocks}
  `;
}

/* ============ 액션 ============ */
function goLanding(){ state.screen='landing'; state.student=null; state.studentIdInput=''; render(); }
function goStudentEntry(){ state.screen='student-entry'; render(); }
function switchStudent(){ state.screen='student-entry'; state.student=null; state.studentIdInput=''; render(); }

async function startStudent(){
  const id = (state.studentIdInput||'').trim();
  if (!id) return;
  state.loading = true; state.loadingMessage = '노트를 불러오는 중...'; render();
  let data = await loadStudent(id);
  if (!data) data = newStudentData(id, state.levelInput);
  state.student = data;
  state.loading = false;
  state.screen = 'student-app';
  setViewIndex(data.currentStageIndex || 0);
}

function setViewIndex(i){
  state.viewIndex = i;
  const stage = STAGES[i];
  const key = stage.key;
  const existing = state.student.stages[key];
  const draft = {};
  stage.fields.forEach(f => draft[f.id] = existing && existing.content ? (existing.content[f.id] || '') : '');
  if (stage.hasCode){
    draft.__code = existing ? (existing.code || '') : '';
    draft.__output = existing ? (existing.codeOutput || '') : '';
    if (!state.pyodide && !state.pyodideLoading && !state.pyodideError) ensurePyodide();
  }
  if (stage.hasSim){
    draft.__simVars = existing && existing.simVars ? [...existing.simVars] : deriveDefaultSimVars();
    draft.__simPair = existing && existing.simPair ? [...existing.simPair] : null;
  }
  state.draft = draft;
  state.stampFlash = false;
  render();
}
function onFieldInput(fieldId, value){ state.draft[fieldId] = value; }
function onCodeInput(value){ state.draft.__code = value; }
function onOutputInput(value){ state.draft.__output = value; }
function addSimVar(){
  const el = document.getElementById('sim-var-input');
  const v = (el ? el.value : '').trim();
  if (!v) return;
  if (!state.draft.__simVars) state.draft.__simVars = [];
  if (state.draft.__simVars.length >= 6 || state.draft.__simVars.includes(v)){ if (el) el.value=''; return; }
  state.draft.__simVars.push(v);
  if (el) el.value = '';
  render();
}
function removeSimVar(idx){
  const removed = state.draft.__simVars.splice(idx, 1)[0];
  if (state.draft.__simPair && (state.draft.__simPair[0]===removed || state.draft.__simPair[1]===removed)){
    state.draft.__simPair = null;
  }
  render();
}
function selectSimPairByIndex(i, j){
  const vars = state.draft.__simVars || [];
  if (vars[i]==null || vars[j]==null) return;
  state.draft.__simPair = [vars[i], vars[j]];
  render();
}

async function handleSave(){
  if (!state.student) return;
  const stage = STAGES[state.viewIndex];
  const prev = state.student.stages[stage.key];
  const revisionCount = prev ? (prev.revisionCount||0) + 1 : 1;
  const content = {};
  stage.fields.forEach(f => content[f.id] = state.draft[f.id] || '');
  const record = {
    content,
    updatedAt: new Date().toISOString(),
    revisionCount
  };
  if (stage.hasCode){
    record.code = state.draft.__code || '';
    record.codeOutput = state.draft.__output || '';
  }
  if (stage.hasSim){
    record.simVars = state.draft.__simVars || [];
    record.simPair = state.draft.__simPair || null;
  }
  state.student.stages[stage.key] = record;
  if (state.viewIndex > (state.student.currentStageIndex||0)) state.student.currentStageIndex = state.viewIndex;
  const ok = await saveStudentData(state.student.studentId, state.student);
  state.stampFlash = ok;
  render();
  if (ok){
    setTimeout(()=>{ state.stampFlash=false; render(); }, 1750);
  }
}
async function handleNext(){
  await handleSave();
  if (state.viewIndex < STAGES.length - 1){
    setViewIndex(state.viewIndex + 1);
  }
}

async function sendTutorMessage(){
  const inputEl = document.getElementById('tutor-input');
  const text = (inputEl ? inputEl.value : '').trim();
  if (!text || state.tutorLoading) return;
  if (!getApiKey()){
    state.showApiKeyForm = true;
    render();
    return;
  }
  const stage = STAGES[state.viewIndex];
  const key = stage.key;
  if (!state.student.tutorChats) state.student.tutorChats = {};
  if (!state.student.tutorChats[key]) state.student.tutorChats[key] = [];
  // 처음 대화라면 저장된 인트로 질문부터 기록에 남긴다
  if (state.student.tutorChats[key].length === 0){
    state.student.tutorChats[key].push({role:'assistant', text:stage.tutorIntro, time:new Date().toISOString()});
  }
  state.student.tutorChats[key].push({role:'user', text, time:new Date().toISOString()});
  state.tutorLoading = true;
  render();
  scrollTutorToBottom();

  try{
    const draftSummary = stage.fields.map(f => `- ${f.label}: ${state.draft[f.id] ? state.draft[f.id] : '(비어있음)'}`).join('\n');
    const level = state.student.level || 'mid';
    const levelGuide = {
      basic: '학생은 이 내용을 배운 지 얼마 안 됐습니다. 전문 용어를 쓸 때는 짧게 풀어서 설명하고, 한 번에 한 가지 개념만 짚어주세요. 필요하다면 간단한 비유나 예시로 개념을 보충 설명해도 좋습니다.',
      mid: '학생은 기본 개념에는 어느 정도 익숙합니다. 개념 설명은 간단히 하고, 스스로 다음 단계를 생각해보도록 질문 위주로 이끌어주세요.',
      advanced: '학생은 이 내용을 능숙하게 다룹니다. 기초 설명은 생략하고, 더 나은 방법이나 놓친 관점을 짚어주는 도전적인 질문을 던지세요.'
    }[level];
    let codeContext = '';
    if (stage.hasCode){
      codeContext = `

학생이 작성한 분석 코드:
${state.draft.__code || '(아직 작성한 코드 없음)'}

코드 실행 결과:
${state.draft.__output || '(아직 실행하지 않음)'}`;
    }
    if (stage.hasSim){
      const simVars = state.draft.__simVars || [];
      const simPair = state.draft.__simPair;
      codeContext += `

학생이 상관관계 미리보기에서 살펴본 변수: ${simVars.length ? simVars.join(', ') : '(아직 없음)'}
학생이 최종적으로 눌러본 조합: ${simPair ? simPair[0]+' × '+simPair[1] : '(아직 선택 안 함)'}
(참고: 이 미리보기는 실제 데이터가 아닌 예시 시뮬레이션입니다. 학생이 이 조합을 실제로 확인해보려면 무엇을 해야 할지 생각해보게 하세요.)`;
    }
    if (stage.hasUpload && state.uploadedData){
      codeContext += `

학생이 업로드한 데이터: ${state.uploadedData.fileName} (${state.uploadedData.rows.length}행, 열: ${state.uploadedData.headers.join(', ')})`;
    }
    const systemPrompt = `당신은 고등학생의 자기주도 데이터 프로젝트를 돕는 AI 튜터입니다.
현재 학생은 "${stage.label}" 단계를 진행 중입니다.
이 단계에서 학생이 답해야 할 질문들:
${stage.fields.map(f=>'- '+f.label).join('\n')}

학생이 지금까지 이 단계에 작성한 내용:
${draftSummary}${codeContext}

학생 수준: ${LEVEL_LABELS[level]}
${levelGuide}

반드시 지킬 규칙:
- 학생 대신 답을 써주거나, 학생이 그대로 옮겨 적을 수 있는 완성된 문장·문단·코드를 절대 제공하지 마세요.
- 학생의 생각을 자극하는 짧고 구체적인 질문을 1~2개 던지는 방식으로만 도와주세요. 필요한 경우에만 위 수준별 가이드에 따라 짧게 보충 설명을 곁들이세요.
- 학생이 이미 쓴 내용이나 코드가 있다면 그것을 근거로 더 깊이 파고드는 질문을 하세요.
- 따뜻하고 격려하는 말투를 쓰되, 불필요한 칭찬을 반복하지 마세요.
- 4~5문장 이내로 짧게 답하세요.
- 반드시 한국어로 답하세요.`;

    const history = state.student.tutorChats[key].map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.text }]
    }));
    const apiKey = getApiKey();
    if (!apiKey){
      state.showApiKeyForm = true;
      throw new Error('API 키 없음');
    }
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: history,
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: { maxOutputTokens: 1000 }
      })
    });
    if (!response.ok){
      let errMsg = '';
      try{ const errBody = await response.json(); errMsg = (errBody && errBody.error && errBody.error.message) || ''; }catch(e){}
      if (response.status === 400 || response.status === 401 || response.status === 403){
        setApiKey('');
        state.showApiKeyForm = true;
        state.apiKeyError = 'API 키가 올바르지 않거나 권한이 없는 것 같아요. 다시 확인해서 입력해주세요.' + (errMsg ? ' (' + errMsg + ')' : '');
        state.student.tutorChats[key].pop(); // 실패한 질문은 기록에서 제거
        state.tutorLoading = false;
        render();
        return;
      }
      if (response.status === 404){
        state.student.tutorChats[key].push({
          role:'assistant',
          text:'지금 설정된 AI 모델(' + GEMINI_MODEL + ')을 더 이상 쓸 수 없나 봐요. 선생님(또는 관리자)에게 코드 속 GEMINI_MODEL 값을 최신 모델로 바꿔달라고 알려주세요. (API 키 자체는 문제 없어요.)',
          time:new Date().toISOString()
        });
        state.tutorLoading = false;
        await saveStudentData(state.student.studentId, state.student);
        render();
        scrollTutorToBottom();
        return;
      }
      if (response.status === 429){
        state.student.tutorChats[key].push({role:'assistant', text:'지금 요청이 많아서 답하기 어려워요. 잠시 후 다시 시도해볼까요?', time:new Date().toISOString()});
        state.tutorLoading = false;
        await saveStudentData(state.student.studentId, state.student);
        render();
        scrollTutorToBottom();
        return;
      }
      throw new Error('API 응답 오류: ' + response.status + (errMsg ? ' ' + errMsg : ''));
    }
    const data = await response.json();
    const candidate = data && data.candidates && data.candidates[0];
    const replyText = candidate && candidate.content && candidate.content.parts
      ? candidate.content.parts.map(p=>p.text||'').join('\n').trim()
      : '';
    state.student.tutorChats[key].push({
      role:'assistant',
      text: replyText || '지금은 생각을 정리하기 어렵네요. 조금 다르게 다시 물어봐줄래요?',
      time:new Date().toISOString()
    });
  }catch(e){
    console.error('튜터 응답 실패', e);
    if (!state.showApiKeyForm){
      state.student.tutorChats[key].push({role:'assistant', text:'지금은 튜터와 연결할 수 없어요. 잠시 후 다시 시도해볼까요?', time:new Date().toISOString()});
    }
  }

  state.tutorLoading = false;
  await saveStudentData(state.student.studentId, state.student);
  render();
  scrollTutorToBottom();
}
function scrollTutorToBottom(){
  const body = document.getElementById('tutor-body');
  if (body) body.scrollTop = body.scrollHeight;
}

/* ============ 코드 창 (Pyodide 기반 Python 실행) ============ */
let pyodideLoadPromise = null;
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if (document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('script load error'));
    document.head.appendChild(s);
  });
}
async function ensurePyodide(){
  if (state.pyodide) return state.pyodide;
  if (pyodideLoadPromise) return pyodideLoadPromise;
  state.pyodideLoading = true; state.pyodideError = false; render();
  pyodideLoadPromise = (async () => {
    try{
      await loadScriptOnce('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
      if (typeof loadPyodide !== 'function') throw new Error('loadPyodide가 정의되지 않았습니다');
      const timeout = new Promise((_, rej) => setTimeout(()=>rej(new Error('시간 초과')), 25000));
      const py = await Promise.race([loadPyodide(), timeout]);
      state.pyodide = py;
      state.pyodideLoading = false;
      render();
      // pandas/numpy는 별도로 시도 — 실패해도 기본 Python 실행 자체는 계속 쓸 수 있게 유지
      try{
        state.pandasLoading = true; render();
        const pandasTimeout = new Promise((_, rej) => setTimeout(()=>rej(new Error('시간 초과')), 40000));
        await Promise.race([py.loadPackage(['pandas', 'numpy']), pandasTimeout]);
        state.pandasReady = true;
      }catch(pkgErr){
        console.error('pandas/numpy 로드 실패, 기본 Python만 사용합니다.', pkgErr);
        state.pandasReady = false;
      }
      state.pandasLoading = false;
      render();
      return py;
    }catch(e){
      console.error('Pyodide 로드 실패', e);
      state.pyodideLoading = false;
      state.pyodideError = true;
      render();
      return null;
    }
  })();
  return pyodideLoadPromise;
}
async function runCode(){
  if (state.pyodideError || state.codeRunning) return;
  const code = state.draft.__code || '';
  if (!code.trim()) return;
  state.codeRunning = true; render();
  try{
    const py = await ensurePyodide();
    if (!py) throw new Error('pyodide 사용 불가');

    let dataPreamble = '';
    if (state.uploadedData){
      const headers = state.uploadedData.headers;
      const rowObjs = state.uploadedData.rows.map(r=>{
        const obj = {};
        headers.forEach((h,i)=> obj[h] = r[i] !== undefined ? r[i] : '');
        return obj;
      });
      dataPreamble = `import json as _json\nheaders = _json.loads(${JSON.stringify(JSON.stringify(headers))})\nrows = _json.loads(${JSON.stringify(JSON.stringify(rowObjs))})\n`;
      if (state.pandasReady){
        dataPreamble += `import pandas as pd\ndf = pd.DataFrame(rows)\nfor _col in df.columns:\n    try:\n        df[_col] = pd.to_numeric(df[_col])\n    except (ValueError, TypeError):\n        pass\n`;
      }
    } else if (state.pandasReady){
      dataPreamble = `import pandas as pd\nimport numpy as np\n`;
    }
    const fullCode = dataPreamble + code;

    const wrapped = `
import sys, io
_buf = io.StringIO()
_old_stdout = sys.stdout
sys.stdout = _buf
try:
    exec(${JSON.stringify(fullCode)})
except Exception as _e:
    print("오류: " + str(_e))
finally:
    sys.stdout = _old_stdout
_buf.getvalue()
`;
    const result = await py.runPythonAsync(wrapped);
    state.draft.__output = result || '(출력 없음 — print()로 값을 출력해보세요)';
  }catch(e){
    console.error('코드 실행 실패', e);
    state.draft.__output = '코드를 실행하는 중 문제가 생겼어요. 코드를 다시 확인해주세요.';
  }
  state.codeRunning = false;
  render();
}

async function enterTeacher(){
  state.screen='teacher-list';
  state.loading=true; state.loadingMessage='학생 목록을 불러오는 중...'; render();
  const students = await loadAllStudents();
  students.sort((a,b)=>{
    const sa = computeSummary(a).lastUpdated, sb = computeSummary(b).lastUpdated;
    return new Date(sb) - new Date(sa);
  });
  state.teacherStudents = students;
  state.loading = false;
  render();
}
